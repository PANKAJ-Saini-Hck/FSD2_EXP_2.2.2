# ─────────────────────────────────────────────
# Datasource – H2 In-Memory (no setup needed)
# ─────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:perfdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ─────────────────────────────────────────────
# JPA / Hibernate
# ─────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─────────────────────────────────────────────
# H2 Console (browser: http://localhost:8080/h2-console)
# ─────────────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─────────────────────────────────────────────
# Seed data
# ─────────────────────────────────────────────
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ─────────────────────────────────────────────
# Cache – Ehcache (JCache / JSR-107)
# ─────────────────────────────────────────────
spring.cache.jcache.config=classpath:ehcache.xml

# ─────────────────────────────────────────────
# Actuator – expose all endpoints for demo
# ─────────────────────────────────────────────
management.endpoints.web.exposure.include=*

# ─────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────
logging.level.com.exp=DEBUG
logging.level.org.hibernate.SQL=DEBUG
